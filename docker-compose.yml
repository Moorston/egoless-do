services:
  # ─── PocketBase 数据库 ──────────────────────────────────────────
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.38.2
    container_name: egoless-do-pb
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./backend/pb_data:/pb/pb_data
      - ./backend/pb_migrations:/pb/pb_migrations
      - ./backend/pb_hooks:/pb/pb_hooks
    environment:
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - egoless-net

  # ─── Next.js Web 应用 ──────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: egoless-do-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - POCKETBASE_URL=http://pocketbase:8090
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - NEXT_PUBLIC_POCKETBASE_URL=${NEXT_PUBLIC_POCKETBASE_URL:-http://localhost:8090}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - egoless-net

  # ─── 数据库自动备份 ──────────────────────────────────────────
  backup:
    image: alpine:3.19
    container_name: egoless-do-backup
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl findutils
        echo "0 3 * * * /scripts/backup-pb.sh" | crontab -
        crond -f -l 2
    volumes:
      - ./scripts/backup-pb.sh:/scripts/backup-pb.sh:ro
      - ./backups:/opt/backups/pb
    environment:
      - PB_URL=http://pocketbase:8090
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
      - RCLONE_REMOTE=${RCLONE_REMOTE:-}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - egoless-net

networks:
  egoless-net:
    driver: bridge
