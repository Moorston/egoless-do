version: "3.9"

services:
  # ─── PocketBase 数据库（仅内网访问，不暴露端口）────────────────
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.38.2
    container_name: egoless-pocketbase
    restart: unless-stopped
    # 不暴露端口到外网 — 仅通过内网访问
    # ports:
    #   - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
      - ./pb_hooks:/pb/pb_hooks
    environment:
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY:?PB_ENCRYPTION_KEY must be set}
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Cloudflare Tunnel (zero-config public HTTPS, free)
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: egoless-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - pocketbase
